# =============================================================================
# SUBOP — Docker Compose Development Environment
# Defines the full local development stack for all three team members.
#
# Quick start:
#   cp .env.example .env
#   docker compose up -d
#
# M1–M2 only (no API yet):
#   docker compose up -d postgres mysql pgadmin zookeeper kafka kafka-ui
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 — Primary data warehouse and platform metadata database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: subop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ---------------------------------------------------------------------------
  # MySQL 8 — Secondary connector target (M2 connector prototype + M6 expansion)
  # Required by M2W6: "Docker MySQL container setup (mysql:8)"
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: subop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:     ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  5
  # ---------------------------------------------------------------------------
  # Microsoft SQL Server 2022 Developer — MSSQL connector test database
  # ---------------------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: subop-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:     ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -N || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  10

  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — Database administration UI
  # Access at http://localhost:5050
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: subop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ---------------------------------------------------------------------------
  # Apache Zookeeper — Kafka cluster coordination service
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: subop-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    ports:
      - "2181:2181"
    healthcheck:
      test:     ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ---------------------------------------------------------------------------
  # Apache Kafka 3.7 — Message broker for CDC events and streaming ingestion
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: subop-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
    ports:
      - "9092:9092"
    healthcheck:
      test:     ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout:  10s
      retries:  5

  # ---------------------------------------------------------------------------
  # Kafka UI — Web interface for Kafka topic and consumer management
  # Access at http://localhost:8080
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: subop-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:             subop-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER:        zookeeper:2181
    ports:
      - "8080:8080"

    # ---------------------------------------------------------------------------
  # SUBOP ETL Engine API — FastAPI + Uvicorn
  # ---------------------------------------------------------------------------
  subop-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: subop-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mssql:
        condition: service_healthy

    environment:
      SUBOP_CONN_PG_MAIN: >-
        {"host":"postgres","port":5432,"database":"${POSTGRES_DB}","username":"${POSTGRES_USER}","password":"${POSTGRES_PASSWORD}"}

      SUBOP_CONN_DW_MAIN: >-
        {"host":"postgres","port":5432,"database":"${POSTGRES_DB}","username":"${POSTGRES_USER}","password":"${POSTGRES_PASSWORD}"}

      SUBOP_CONN_MYSQL_MAIN: >-
        {"host":"mysql","port":3306,"database":"${MYSQL_DATABASE}","username":"${MYSQL_USER}","password":"${MYSQL_PASSWORD}"}

      SUBOP_CONN_MSSQL_MAIN: >-
        {"host":"mssql","port":1433,"database":"master","username":"sa","password":"${MSSQL_SA_PASSWORD}"}

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/pipelines/"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  mssql_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: subop-network
